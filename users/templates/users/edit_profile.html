{% extends "drinks/base.html" %}

{% block title %}
    {{ title }}
{% endblock %}

{% block content %}

<h2>{{ title }}</h2>

<form
    method="post"
    enctype="multipart/form-data"
    class="user-form"
>

    {% csrf_token %}

    <div class="form-error">
        {{ form.non_field_errors }}
    </div>

    {% for field in form %}

        <p>

            <label for="{{ field.id_for_label }}">
                {{ field.label }}:
            </label>

            <br>

            {{ field }}

            {% if field.errors %}

                <span class="form-error">
                    {{ field.errors }}
                </span>

            {% endif %}

        </p>

    {% endfor %}

    <button type="submit">
        Сохранить изменения
    </button>

</form>

<p>
    <a href="{% url 'users:profile' %}">
        Назад в профиль
    </a>
</p>

{% endblock %}
