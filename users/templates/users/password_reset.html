{% extends "drinks/base.html" %}

{% block title %}
    Восстановление пароля
{% endblock %}

{% block content %}

<h2>Восстановление пароля</h2>

<p>
    Введите E-mail,
    указанный при регистрации.
</p>

<form
    method="post"
    class="user-form"
>

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Отправить
    </button>

</form>

{% endblock %}
