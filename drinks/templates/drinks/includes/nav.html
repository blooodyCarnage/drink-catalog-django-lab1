    <a href="{% url 'home' %}">

    </a>

    <a href="{% url 'about' %}">

    </a>

    </a>

    {% if perms.drinks.add_drink %}

        <a href="{% url 'add_plain' %}">
            Обычная форма
        </a>

        <a href="{% url 'add_model' %}">

        </a>

    {% endif %}

    {% if user.is_authenticated %}

        <a href="{% url 'upload_file' %}">

        </a>

    <a href="{% url 'search' %}">

            <button
                type="submit"
                class="nav-button"

        <a href="{% url 'users:login' %}">
