{% extends "drinks/base.html" %}

{% block title %}
    {{ title }}
{% endblock %}

{% block content %}
    <h2>Загрузка файла на сервер</h2>

    <form
        method="post"
        enctype="multipart/form-data"
    >
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Загрузить
        </button>
    </form>

    {% if uploaded_file %}
        <p>
            <strong>Файл успешно загружен:</strong>
            {{ uploaded_file }}
        </p>
    {% endif %}
{% endblock %}
